services:
  - type: web
    name: gridbricks-wind-forecast-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "600"
      - key: ELEXON_API_BASE
        value: https://data.elexon.co.uk/bmrs/api/v1/
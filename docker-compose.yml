services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      CACHE_TTL_SECONDS: 600
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
